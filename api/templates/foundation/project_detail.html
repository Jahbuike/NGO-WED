 {% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'api/css/style.css' %}">
    <title>{{ title }} | Josh Foundation</title>
</head>
<body>
    <nav>
        <div class="logo">JOSH FOUNDATION</div>
        <a href="{% url 'home' %}">← Back to Home</a>
    </nav>

    <div class="detail-container" style="padding: 100px 10%;">
        <h1>{{ title }}</h1>
        <img src="{{ image_url }}" style="width:100%; border-radius: 15px; height: 400px; object-fit: cover;">
        
        <div class="content" style="margin-top: 30px;">
            <h2>About this Project</h2>
            <p>{{ description }}</p>
            
            <h3>Our Impact</h3>
            <p>{{ impact }}</p>
        </div>
    </div>
</body>
</html>
